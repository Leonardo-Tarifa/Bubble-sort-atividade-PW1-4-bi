<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Bubble Sort</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #222;
            color: white;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        #lista {
            display: flex;
            justify-content: center;
            align-items: end;
            gap: 10px;
            height: 350px;
            margin-top: 80px;
        }

        .barra {
            width: 50px;
            max-height: 300px;
            background: #3498db;
            display: flex;
            justify-content: center;
            align-items: end;
            color: white;
            padding-bottom: 5px;
        }

        .comparando {
            background: red;
        }
    </style>
</head>

<body>

    <h1>Bubble Sort</h1>

    <input id="entrada" value="500, 300, 800, 100, 400">

    <br>

    <button onclick="iniciar()">Iniciar</button>
    <button onclick="passo()">Próximo passo</button>

    <h2 id="mensagem">
        Digite os números e clique em iniciar
    </h2>

    <div id="lista"></div>

    <script>

        let numeros = [];
        let i = 0;
        let j = 0;
        let automatico;

        function iniciar() {

            clearInterval(automatico);

            numeros = document
                .getElementById("entrada")
                .value
                .split(",")
                .map(Number);

            i = 0;
            j = 0;

            mostrar();

            automatico = setInterval(passo, 2000);
        }

        function mostrar(a = -1, b = -1) {

            let lista = document.getElementById("lista");

            lista.innerHTML = "";

            let maior = Math.max(...numeros);

            numeros.forEach((numero, indice) => {

                let barra = document.createElement("div");

                barra.className = "barra";

                if (indice == a || indice == b) {
                    barra.classList.add("comparando");
                }

                barra.style.height =
                    (numero / maior) * 300 + "px";

                barra.innerText = numero;

                lista.appendChild(barra);
            });
        }

        function passo() {

            if (i >= numeros.length - 1) {

                clearInterval(automatico);

                document.getElementById("mensagem").innerText =
                    "Ordenação concluída!";

                mostrar();

                return;
            }

            if (j >= numeros.length - i - 1) {

                j = 0;
                i++;
            }

            mostrar(j, j + 1);

            document.getElementById("mensagem").innerText =
                "Comparando " +
                numeros[j] +
                " e " +
                numeros[j + 1];

            if (numeros[j] > numeros[j + 1]) {

                let temp = numeros[j];

                numeros[j] = numeros[j + 1];
                numeros[j + 1] = temp;

                document.getElementById("mensagem").innerText =
                    "Troca realizada!";
            }

            j++;
        }

    </script>

</body>
</html>
